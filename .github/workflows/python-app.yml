name: Run Telegram Bot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # מאפשר להריץ את הבוט ידנית בלחיצת כפתור

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-telegram-bot # או כל ספרייה אחרת שאתה משתמש בה
        # אם יש לך קובץ requirements.txt תמחק את השורה למעלה ותכתוב במקום:
        # pip install -r requirements.txt

    - name: Run Bot Script
      env: 
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }} # הסבר למטה
      run: python bot.py # שים לב! שנה את bot.py לשם הקובץ האמיתי שלך
