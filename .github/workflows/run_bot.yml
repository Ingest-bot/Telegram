name: News Bot Unified

on:
  repository_dispatch:
    types: [run-bot]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # התקנה ישירה של כל מה שצריך כולל tweepy
          pip install feedparser python-telegram-bot requests tweepy

      - name: Run Bot
        env:
          # טלגרם
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          HAMAL_TELEGRAM_TOKEN: ${{ secrets.HAMAL_TELEGRAM_TOKEN }}
          HAMAL_CHAT_ID: ${{ secrets.HAMAL_CHAT_ID }}
          # טוויטר - חובה להוסיף כאן כדי שהקוד "יראה" את הסודות
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: python bot.py

      - name: Update History
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          
          # יצירת קבצים אם הם חסרים
          if [ ! -f counter.txt ]; then echo "0" > counter.txt; fi
          if [ ! -f last_links.txt ]; then touch last_links.txt; fi
          
          git add last_links.txt counter.txt
          git commit -m "Update news and counter [skip ci]" || echo "No changes"
          
          git pull --rebase origin main
          git push origin main
