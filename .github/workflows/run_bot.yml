- name: Commit and Push history changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # פתרון לשגיאת ה-unstaged changes:
          # אנחנו אומרים לגיט לשמור בצד את השינויים המקומיים, למשוך את העדכונים, ואז להחזיר
          git add last_links.txt
          git stash || echo "No changes to stash"
          git pull --rebase origin main
          git stash pop || echo "No stash to pop"
          
          # עכשיו מבצעים את השמירה הסופית
          git add last_links.txt
          git commit -m "Update news history [skip ci]" || echo "No changes to commit"
          git push origin main
